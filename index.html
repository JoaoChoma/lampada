<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lâmpada com JavaScript</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="container">
        <h1>Minha Lâmpada</h1>

        <div class="lampada">
            <img
                id="imagemLampada"
                src="imagens/lampada-apagada.png"
                alt="Lâmpada apagada"
            >
        </div>

        <h2 id="textoEstado">Lâmpada apagada!</h2>

        <div class="botoes">
            <button id="btnAcender" class="btn acender">Acender</button>
            <button id="btnApagar" class="btn apagar">Apagar</button>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
